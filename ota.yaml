version: 1
metadata:
  ota:
    minimum_version: "1.6.18"
# Pressure-test note (local branch):
# - Remove the `toolchains.dotnet` migration before an upstream PR if the target PR must remain on
#   an older Ota release that does not ship the same dotnet toolchain behavior.
project:
  name: OrchardCore
  description: OrchardCore readiness slice covering Abstractions unit-project restore, build, and test
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        engines:
          - docker
          - podman
toolchains:
  dotnet:
    provider: dotnet
    version: '10.0'
tasks:
  build:
    context: host
    category: build
    description: Build the OrchardCore Abstractions unit test project.
    run: dotnet build test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet build test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
        container:
          context: app
          run: dotnet build test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    notes: Build the selected unit-test project for this contract slice.
  setup:
    context: host
    category: setup
    description: Restore dependencies for the Abstractions unit test project.
    run: dotnet restore test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet restore test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
        container:
          context: app
          run: dotnet restore test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj
    requirements:
      toolchains:
        - dotnet
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Restore dependencies for the selected unit-test project.
    internal: true
  test:
    context: host
    category: test
    description: Run the OrchardCore Abstractions unit test project.
    run: dotnet test --project test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj --verbosity minimal
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet test --project test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj --verbosity minimal
        container:
          context: app
          run: dotnet test --project test/OrchardCore.Abstractions.Tests/OrchardCore.Abstractions.Tests.csproj --verbosity minimal
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    safe_for_agent: false
    notes: Run the selected unit-test project for this contract slice.
  verify:
    category: test
    description: Aggregate baseline OrchardCore verification checks.
    aggregate:
      tasks:
        - build
        - test
    safe_for_agent: false
    notes: Contract-level verification path.
workflows:
  default: verify
  verify:
    description: Canonical OrchardCore verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus baseline verification sequence.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks: []
  verify_after_changes: []
  writable_paths:
  - src/OrchardCore
  - src/OrchardCore.Cms.Web
  - src/OrchardCore.Modules
  - src/OrchardCore.Mvc.Web
  - src/OrchardCore.Themes
  - test
  protected_paths:
  - .github/workflows
  - global.json
  - yarn.lock
  - ota.yaml
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:nested_project_root
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=08c270351c9870c82a39899161388bb250ad23c4 sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='08c270351c9870c82a39899161388bb250ad23c4'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.

version: 1
metadata:
  ota:
    minimum_version: "1.6.22"
project:
  name: OrchardCore
  description: OrchardCore readiness slice covering Abstractions unit-project restore, build, and test
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        engines:
          - docker
          - podman
toolchains:
  dotnet:
    version: '10.0'
    fulfillment:
      source: dotnet
      mode: run
tasks:
  build:
    context: host
    category: build
    description: Build the OrchardCore Abstractions unit test project.
    command:
      exe: dotnet
      args:
        - build
        - --no-restore
      cwd: test/OrchardCore.Abstractions.Tests
    execution:
      default_mode: native
      modes:
        native:
          context: host
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    notes: Build the selected unit-test project for this contract slice.
  setup:
    context: host
    category: setup
    description: Restore dependencies for the Abstractions unit test project.
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: dotnet_restore
        cwd: test/OrchardCore.Abstractions.Tests
    execution:
      default_mode: native
      modes:
        native:
          context: host
        container:
          context: app
    requirements:
      toolchains:
        - dotnet
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Restore dependencies for the selected unit-test project.
    internal: true
  test:
    context: host
    category: test
    description: Run the OrchardCore Abstractions unit test project.
    command:
      exe: dotnet
      args:
        - test
        - --no-restore
        - --verbosity
        - minimal
      cwd: test/OrchardCore.Abstractions.Tests
    execution:
      default_mode: native
      modes:
        native:
          context: host
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    safe_for_agent: false
    notes: Run the selected unit-test project for this contract slice.
  verify:
    category: test
    description: Aggregate baseline OrchardCore verification checks.
    aggregate:
      tasks:
        - build
        - test
    safe_for_agent: false
    notes: Contract-level verification path.
workflows:
  default: verify
  verify:
    description: Canonical OrchardCore verification path for this contract slice.
    prepare:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus baseline verification sequence.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks: []
  verify_after_changes: []
  writable_paths:
  - src/OrchardCore
  - src/OrchardCore.Cms.Web
  - src/OrchardCore.Modules
  - src/OrchardCore.Mvc.Web
  - src/OrchardCore.Themes
  - test
  protected_paths:
  - .github/workflows
  - global.json
  - yarn.lock
  - ota.yaml
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:nested_project_root
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=f78c7f1cd4fdae0c92be06d9834e2b3c9957beee sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='f78c7f1cd4fdae0c92be06d9834e2b3c9957beee'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
